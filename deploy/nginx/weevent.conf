# WE Events / WE Displays — static site (Astro dist)
# Installed to /etc/nginx/sites-available/weevent by setup-vultr.sh

server {
    listen 80;
    listen [::]:80;
    server_name we-events.co.nz www.we-events.co.nz;

    root /var/www/weevent;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Astro static output (directory format)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Cache static assets
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
}
